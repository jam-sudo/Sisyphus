name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Serial CI reached ~49min; xdist parallelizes the unit and integration steps.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Guard — no internal/development references in tracked files
        run: python3 scripts/check_no_internal_refs.py

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Installed-wheel prediction smoke
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/sisyphus-wheel
          python -m pip install --no-deps --target /tmp/sisyphus-installed /tmp/sisyphus-wheel/*.whl
          cd /tmp
          SISYPHUS_ROOT="$GITHUB_WORKSPACE" PYTHONPATH=/tmp/sisyphus-installed \
            python -c "from sisyphus.pipeline.predict import predict; r=predict('CCO', 10.0, strict=True); assert r.execution_status == 'ok'"

      - name: Ruff (gating; pre-existing violations baselined via inline noqa)
        run: >-
          ruff check src tests server
          scripts/build_n50_exclusion.py
          scripts/gen_console_data.py
          scripts/audit_external_holdout_manifest.py
          scripts/predict_external_holdout_manifest.py
          scripts/score_external_holdout.py
          scripts/sync_public_model_metrics.py
          scripts/prediction_trace.py

      - name: Unit tests
        run: pytest tests/unit -n auto -v --tb=short --run-slow

      - name: Integration tests (full)
        run: pytest tests/integration -n auto -v --tb=short --run-slow

      - name: Regression tests (registry pinning, holdout invariance, prodrug gates)
        run: pytest tests/regression -v --tb=short --run-slow

      - name: Benchmark smoke (N≤10 holdout drugs, slow marker)
        run: pytest tests/benchmark/test_holdout.py -v --tb=short --run-slow

  sbi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked and SBI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install sbi==0.24.0 nflows==0.14
          pip install -e . --no-deps
      - name: Torch and SBI tests
        run: >-
          pytest -v --tb=short
          tests/unit/test_continuous_hierarchical.py
          tests/unit/test_sbi_amortizer.py
          tests/unit/test_sbi_hierarchical.py
          tests/unit/test_sbi_multi_drug.py
          tests/unit/test_sbi_simulator.py
          tests/unit/test_tdm_sbi.py

  server-security:
    # Exercise the API contract with the same CPU-only runtime deps as the image.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install production API dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest==9.0.3 ruff==0.15.11 httpx==0.28.1
          pip install -e . --no-deps

      - name: Ruff (server adapter, policy, and tests)
        run: ruff check server

      - name: Server API and security tests
        run: python -m pytest server/tests -v --tb=short

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build exact-source API image
        run: docker build -f server/Dockerfile -t sisyphus-api:ci .
      - name: Smoke-test prediction in built image
        run: |
          docker run -d --rm -p 127.0.0.1:7860:7860 --name sisyphus-api-ci sisyphus-api:ci
          trap 'docker stop sisyphus-api-ci' EXIT
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail --silent --show-error http://127.0.0.1:7860/health
          curl --fail --silent --show-error -X POST http://127.0.0.1:7860/predict \
            -H 'Content-Type: application/json' \
            -d '{"smiles":"CCO","dose_mg":100}' -o /tmp/sisyphus-predict.json
          python -c 'import json; p=json.load(open("/tmp/sisyphus-predict.json")); assert p["executionStatus"] == "ok" and p["meta"]["cmax"] > 0'
      - name: Build and smoke-test holdout evaluator image
        run: |
          docker build -f scripts/Dockerfile.holdout -t sisyphus-holdout:ci .
          docker run --rm -v "$PWD:/repo:ro" sisyphus-holdout:ci \
            python scripts/audit_external_holdout_manifest.py --help
          docker run --rm -v "$PWD:/repo:ro" sisyphus-holdout:ci \
            python -c 'from sisyphus.pipeline.predict import predict; assert predict("CCO", 10, strict=True).execution_status == "ok"'
