name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Suite wall-time reached ~24-25min after the paracellular merge (the prior
    # ceiling timed out main + feature CI); 40 gives headroom. pytest-xdist
    # parallelization is the follow-up to bring this back down.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Ruff (gating; pre-existing violations baselined via inline noqa)
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests/unit -v --tb=short

      - name: Integration tests (full)
        run: pytest tests/integration -v --tb=short

      - name: Regression tests (registry pinning, holdout invariance, prodrug gates)
        run: pytest tests/regression -v --tb=short

      - name: Benchmark smoke (N≤10 holdout drugs, slow marker)
        run: pytest tests/benchmark/test_holdout.py -v --tb=short

  server-security:
    # The engine API security contract (CORS allow-list + /predict rate limit).
    # Deliberately engine-free: server/config.py + server/tests import neither the
    # heavy engine graph nor torch, so this job stays fast and gates the security
    # behavior that the main `test` job's testpaths=["tests"] does not collect.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install server deps (no engine)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi slowapi httpx pytest ruff

      - name: Ruff (server policy module + tests)
        run: ruff check server/config.py server/tests

      - name: Server security tests (CORS + rate limit, engine-import-free)
        run: pytest server/tests -v --tb=short
