name: FLUX-1 canonical regen

# One-off manual workflow: regenerate the post-FLUX-1 benchmark cache + leak-audit
# baseline + CI bootstrap on the canonical CI stack (ubuntu-latest / Python 3.10 /
# requirements-lock.txt — the same stack ci.yml validates against). A fresh checkout
# is automatically public-clone state (data/drugbank + logp_correction are gitignored),
# so this produces canonical numbers without any developer machine. The regenerated
# files are uploaded as artifacts to download and commit.
#
# Trigger:  gh workflow run flux1-regen.yml --ref fix/flux1-extraction-double-count
# Then:     gh run download <run-id>  (cache + baseline + bootstrap + regen_output.txt)

on:
  workflow_dispatch:   # manual only; dispatchable once on the default branch (kept for the OATP1B1 re-anchor follow-up regen)

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Confirm public-clone state (artifacts must be absent)
        run: |
          test ! -e data/drugbank/drugs.csv || (echo "drugbank present — not public-clone" && exit 1)
          test ! -e models/adme/logp_correction.json || (echo "logp_correction present" && exit 1)

      - name: Regenerate canonical FLUX-1 artifacts
        run: PYTHONPATH=src python scripts/regen_flux1_canonical.py 2>&1 | tee regen_output.txt

      - name: Upload regenerated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flux1-canonical
          path: |
            data/training/4track_holdout_predictions.json
            tests/regression/data/prodrug_v3_pre_baseline.json
            data/validation/4track_ci_*flux1*.json
            regen_output.txt
          if-no-files-found: error
