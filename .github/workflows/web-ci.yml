name: web-ci

# Validates the Sisyphus Console build on every change under web/.
# Deployment is NOT done here: the built bundle is committed to the repo-root
# /app folder (via `npm run build:pages`) and served by the existing Jekyll
# GitHub Pages deployment at sisyphus-pbpk.io/app/ (the homepage stays at /).

on:
  pull_request:
    paths: ["web/**"]
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run smoke # headless render guard for all six workflows
