# ICRP Reference Man — 70 kg, 34-node whole-body PBPK graph
# Source: Omega PBPK codebase, adapted to Sisyphus graph format
# All volumes in litres, flows as fractions of cardiac output

global_params:
  cardiac_output: {mean: 390.0, cv: 0.10}   # L/h  (6.5 L/min)
  body_weight: {mean: 70.0, cv: 0.0}        # kg
  hematocrit: {mean: 0.45, cv: 0.0}
  ivive_scaling: 0.00006                     # 60/1e6: converts uL/min -> L/h

# ─────────────────────────────────────────────
#  NODES  (34 total)
# ─────────────────────────────────────────────
nodes:

  # ── Blood pools (3) ──────────────────────
  - name: venous_blood
    type: blood_pool
    volume: 3.7

  - name: arterial_blood
    type: blood_pool
    volume: 1.5

  - name: portal_vein
    type: blood_pool
    volume: 0.05

  # ── Perfusion-limited organs (11) ────────
  - name: lung
    type: organ
    volume: 0.50
    composition: {fn: 0.0030, fp: 0.0128, fw: 0.811, pH: 7.0}

  - name: brain
    type: organ
    volume: 1.45
    composition: {fn: 0.0391, fp: 0.0550, fw: 0.620, pH: 7.0}

  - name: heart
    type: organ
    volume: 0.33
    composition: {fn: 0.0117, fp: 0.0166, fw: 0.758, pH: 7.0}

  - name: liver
    type: organ
    volume: 1.80
    composition: {fn: 0.0348, fp: 0.0252, fw: 0.751, pH: 7.0}
    enzymes:
      # Achour 2021 (PMC7839483, CC BY-NC 4.0) Table S7 CVs + log-space
      # correlation matrix; means unchanged from prior calibration.
      # See data/physiology/achour2021_correlation.json.
      CYP3A4: {mean: 9247500, cv: 0.763, correlation_group: liver_achour2021}
      CYP2D6: {mean:  675000, cv: 1.185, correlation_group: liver_achour2021}
      CYP1A2: {mean: 3037500, cv: 0.533, correlation_group: liver_achour2021}
      CYP2C9: {mean: 6480000, cv: 0.717, correlation_group: liver_achour2021}
      CYP2E1: {mean: 3307500, cv: 0.442, correlation_group: liver_achour2021}
      # Prodrug activation enzymes — independent lognormal (no Achour matrix entry).
      # Values from T1 literature deliverable
      # (docs/superpowers/specs/2026-04-27-prodrug-v2-task1-literature.md §1).
      SPR:  {mean: 1.0e5, cv: 1.0}    # Class-estimated; rat specific activity (PMC7520308) + UniProt P35270 MW
      CES1: {mean: 8.0e7, cv: 0.47}   # Boberg 2017 PMC5267516: 1664 pmol/mg × 48000 mg microsomal
      CES2: {mean: 8.4e6, cv: 0.61}   # Boberg 2017 PMC5267516: 174 pmol/mg × 48000 mg microsomal
      # Phase II non-CYP enzymes for issue #10 phenotype propagation (v0.3.2).
      # Independent lognormal — no Achour 2021 matrix entry. Position at end of
      # enzymes block minimizes RNG-order disruption to existing tests.
      NAT2:    {mean: 1.0e7,   cv: 0.6}    # Cytosolic. Calibration-arbitrary anchored to Grant 1991 cytosolic activity range; absolute value back-solved by _decompose_clint such that abundance × affinity × ivive_scaling = NAT2 fm × CLint_hepatic.
      UGT1A1:  {mean: 1.215e6, cv: 0.5}    # Achour 2014 PMC4118705: 18 pmol/mg microsomal × 45 MPPGL × 1500g. Consistent with ivive.py _LIVER_ENZYME_ABUNDANCE.
      UGT2B7:  {mean: 2.43e6, cv: 0.5}    # B-02 Phase 2 (2026-05-26): 36 pmol/mg × 45 MPPGL × 1500g. Conservative class-default within published UGT2B7 hepatic abundance range (30-60 pmol/mg). Open-access source: confirm against Achour 2017 PMC5328673 or Margaillan 2015 DMD 43:1532 at impl-PR-review.
      UGT1A9:  {mean: 8.10e5, cv: 0.5}    # B-02 Phase 2: 12 pmol/mg × 45 × 1500g. Within 10-20 pmol/mg published range; same source as UGT2B7.
    transporters:
      # OATP1B1 independent lognormal — Achour 2021 empirical r<0.3 vs CYPs.
      # Anchor: pravastatin 40 mg PO Cmax 0.045 mg/L (FDA label) under
      # ECM-only hepatic clearance (post-#12 metabolic_fraction=0 for
      # pravastatin removes XGBoost-CYP / ECM double-counting).
      # Calibration sweep 2026-05-02: FE 1.058 at 5.0e5
      # (data/validation/oatp_ecm_abundance_calibration.json).
      OATP1B1: {mean: 5.0e5, cv: 0.484}
    ivive_scaling: 0.00006   # 60/1e6: converts uL/min -> L/h (MPPGL * organ_wt already in abundance)
    fu_correction_applicable: 1.0   # B-11: hepatic intracellular fu correction is applied at this node by ClearanceFlux + ProdrugActivationFlux

  - name: spleen
    type: organ
    volume: 0.15
    composition: {fn: 0.0077, fp: 0.0113, fw: 0.788, pH: 7.0}

  - name: gut_wall
    type: barrier_organ
    volume: 1.03
    composition: {fn: 0.0163, fp: 0.0185, fw: 0.718, pH: 7.0}
    enzymes:
      CYP3A4: 21224338      # scaled to match midazolam gut CLint 1600 L/h
      # Prodrug activation enzymes — independent lognormal.
      # Values from T1 deliverable §1 (intestinal-specific isoforms).
      SPR:  {mean: 3.0e3, cv: 1.2}    # Lower expression vs liver (PMC7520308 colon mention)
      CES2: {mean: 3.0e6, cv: 0.6}    # Al-Majdoub 2020 PMC8048492: 500 pmol/mg × 6000 mg mucosal
      ALPI: {mean: 2.3e4, cv: 0.9}    # Al-Majdoub 2020 PMC8048492: 3.89 pmol/mg × 6000 mg mucosal
      # Phase II UGT — gut wall expression (B-13 Phase 2.x follow-up to B-02 UGT registries).
      # PROVENANCE (audit 2026-05-29, verify-gut-ugt-citations workflow, 11 agents): the spec's
      # original fallback citations were CONFABULATED and have been removed — "Bhatt 2019 DMD
      # 47:498" resolves to an unrelated maraviroc DDI paper (PMID 30862625; the only real Bhatt
      # 2019 UGT2B7 paper is hepatic, CPT 105:131-141), and "Akabane 2012 DMD 40:1310" does not
      # exist (NCBI esearch count=0). Re-derived from primary intestinal proteomics below, on the
      # total-mucosal-protein basis consistent with the ×6000 scale (same dataset family as ALPI).
      UGT2B7: {mean: 3.6e3, cv: 0.6}  # Al-Majdoub 2021 CPT 109:1136 (PMC8048492) median 0.60 pmol/mg × 6000 mg mucosal; corroborated Couto 2020 DMD 48:245 (jejunum 1.84 / ileum 1.17 pmol/mg). Gut UGT2B7 ≈ 0.15% of hepatic (2.43e6) — completeness term, NOT a morphine fix (cf. DE-39).
      # UGT1A9 — DROPPED: not expressed in human small intestine. Oda 2012 DMD 40:1620 (PMID
      # 22619308) isoform-specific monoclonal antibody finds UGT1A9 in kidney+liver but NOT in
      # jejunum/ileum; Couto/Achour 2020 (PMID 32955894) report UGT1A9 in liver+kidney only
      # (UGT1A10 is the intestine-specific 1A isoform); Couto 2020 global proteomics: UGT1A9
      # absent from >5000 intestinal proteins. Drug-level UGT1A9 affinity still acts at liver.
      # CES1 omitted — Hatfield 2016 PMC6635651: negligible in human intestine.
    ivive_scaling: 0.00006   # 60/1e6: converts uL/min -> L/h (MPPGL * organ_wt already in abundance)

  - name: kidney
    type: organ
    volume: 0.31
    composition: {fn: 0.0121, fp: 0.0242, fw: 0.783, pH: 7.0}
    enzymes:
      # Prodrug activation — renal SPR contribution (T1 §1, sanity-only level).
      # NB: kidney listed after liver/gut_wall to keep enzyme RNG sample order
      # stable when adding new prodrug enzymes (test_engine_validation seed).
      SPR: {mean: 3.0e4, cv: 1.0}
    ivive_scaling: 0.00006

  - name: pancreas
    type: organ
    volume: 0.10
    composition: {fn: 0.0348, fp: 0.0252, fw: 0.751, pH: 7.0}

  - name: thymus
    type: organ
    volume: 0.02
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  - name: reproductive
    type: organ
    volume: 0.04
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  - name: rest
    type: organ
    volume: 2.50
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  # ── Permeability-limited organs (4 x 2 = 8 nodes) ──
  # Adipose
  - name: adipose_vasc
    type: blood_pool
    volume: 0.725          # 0.05 * 14.5
    lookup_name: adipose

  - name: adipose_tissue
    type: organ
    volume: 13.775         # 0.95 * 14.5
    composition: {fn: 0.7021, fp: 0.0022, fw: 0.150, pH: 7.0}
    lookup_name: adipose

  # Muscle
  - name: muscle_vasc
    type: blood_pool
    volume: 1.40           # 0.05 * 28.0
    lookup_name: muscle

  - name: muscle_tissue
    type: organ
    volume: 26.60          # 0.95 * 28.0
    composition: {fn: 0.0238, fp: 0.0072, fw: 0.760, pH: 7.0}
    lookup_name: muscle

  # Bone
  - name: bone_vasc
    type: blood_pool
    volume: 0.243          # 0.05 * 4.86
    lookup_name: bone

  - name: bone_tissue
    type: organ
    volume: 4.617          # 0.95 * 4.86
    composition: {fn: 0.0174, fp: 0.0010, fw: 0.439, pH: 7.0}
    lookup_name: bone

  # Skin
  - name: skin_vasc
    type: blood_pool
    volume: 0.165          # 0.05 * 3.30
    lookup_name: skin

  - name: skin_tissue
    type: organ
    volume: 3.135          # 0.95 * 3.30
    composition: {fn: 0.0284, fp: 0.0111, fw: 0.718, pH: 7.0}
    lookup_name: skin

  # ── GI lumen segments (8) ───────────────
  - name: stomach_lumen
    type: lumen
    volume: 0.25

  - name: duodenum_lumen
    type: lumen
    volume: 0.05

  - name: jejunum1_lumen
    type: lumen
    volume: 0.07

  - name: jejunum2_lumen
    type: lumen
    volume: 0.07

  - name: ileum1_lumen
    type: lumen
    volume: 0.06

  - name: ileum2_lumen
    type: lumen
    volume: 0.06

  - name: ileum3_lumen
    type: lumen
    volume: 0.06

  - name: colon_lumen
    type: lumen
    volume: 0.30

  # ── Sinks (4) ───────────────────────────
  - name: metabolized_hepatic
    type: sink
    volume: 1.0e+10

  - name: excreted_renal
    type: sink
    volume: 1.0e+10

  - name: metabolized_gut
    type: sink
    volume: 1.0e+10

  - name: excreted_fecal
    type: sink
    volume: 1.0e+10

# ─────────────────────────────────────────────
#  EDGES
# ─────────────────────────────────────────────
edges:

  # ── Pulmonary circulation ────────────────
  - {source: venous_blood, target: lung, type: flow, flow_fraction: 1.0}
  - {source: lung, target: arterial_blood, type: flow, flow_fraction: 1.0}

  # ── Systemic: perfusion-limited organs ───
  # Brain
  - {source: arterial_blood, target: brain, type: flow, flow_fraction: 0.12}
  - {source: brain, target: venous_blood, type: flow}

  # Heart
  - {source: arterial_blood, target: heart, type: flow, flow_fraction: 0.04}
  - {source: heart, target: venous_blood, type: flow}

  # Kidney
  - {source: arterial_blood, target: kidney, type: flow, flow_fraction: 0.19}
  - {source: kidney, target: venous_blood, type: flow}

  # Liver (hepatic artery only — portal input is separate)
  - {source: arterial_blood, target: liver, type: flow, flow_fraction: 0.065}
  - {source: liver, target: venous_blood, type: flow, flow_fraction: 0.255}

  # Gut wall (drains to portal vein)
  - {source: arterial_blood, target: gut_wall, type: flow, flow_fraction: 0.15}
  - {source: gut_wall, target: portal_vein, type: flow}

  # Spleen (drains to portal vein)
  - {source: arterial_blood, target: spleen, type: flow, flow_fraction: 0.03}
  - {source: spleen, target: portal_vein, type: flow}

  # Pancreas (drains to portal vein)
  - {source: arterial_blood, target: pancreas, type: flow, flow_fraction: 0.01}
  - {source: pancreas, target: portal_vein, type: flow}

  # Portal vein → liver
  - {source: portal_vein, target: liver, type: flow, flow_fraction: 0.19}

  # Thymus
  - {source: arterial_blood, target: thymus, type: flow, flow_fraction: 0.002}
  - {source: thymus, target: venous_blood, type: flow}

  # Reproductive
  - {source: arterial_blood, target: reproductive, type: flow, flow_fraction: 0.002}
  - {source: reproductive, target: venous_blood, type: flow}

  # Rest
  - {source: arterial_blood, target: rest, type: flow, flow_fraction: 0.069}
  - {source: rest, target: venous_blood, type: flow}

  # ── Systemic: permeability-limited organs ──
  # Adipose
  - {source: arterial_blood, target: adipose_vasc, type: flow, flow_fraction: 0.052}
  - {source: adipose_vasc, target: venous_blood, type: flow}
  - {source: adipose_vasc, target: adipose_tissue, type: diffusion, ps_product: 10.0}

  # Muscle
  - {source: arterial_blood, target: muscle_vasc, type: flow, flow_fraction: 0.17}
  - {source: muscle_vasc, target: venous_blood, type: flow}
  - {source: muscle_vasc, target: muscle_tissue, type: diffusion, ps_product: 10.0}

  # Bone
  - {source: arterial_blood, target: bone_vasc, type: flow, flow_fraction: 0.05}
  - {source: bone_vasc, target: venous_blood, type: flow}
  - {source: bone_vasc, target: bone_tissue, type: diffusion, ps_product: 10.0}

  # Skin
  - {source: arterial_blood, target: skin_vasc, type: flow, flow_fraction: 0.05}
  - {source: skin_vasc, target: venous_blood, type: flow}
  - {source: skin_vasc, target: skin_tissue, type: diffusion, ps_product: 10.0}

  # ── GI transit ───────────────────────────
  - {source: stomach_lumen, target: duodenum_lumen, type: transit, transit_rate: 4.0}
  - {source: duodenum_lumen, target: jejunum1_lumen, type: transit, transit_rate: 3.846}
  - {source: jejunum1_lumen, target: jejunum2_lumen, type: transit, transit_rate: 2.105}
  - {source: jejunum2_lumen, target: ileum1_lumen, type: transit, transit_rate: 2.105}
  - {source: ileum1_lumen, target: ileum2_lumen, type: transit, transit_rate: 1.471}
  - {source: ileum2_lumen, target: ileum3_lumen, type: transit, transit_rate: 1.471}
  - {source: ileum3_lumen, target: colon_lumen, type: transit, transit_rate: 1.471}
  - {source: colon_lumen, target: excreted_fecal, type: transit, transit_rate: 0.074}

  # ── Absorption (lumen → gut_wall) ────────
  - {source: stomach_lumen, target: gut_wall, type: absorption, ka_fraction: 0.0}
  - {source: duodenum_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: jejunum1_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: jejunum2_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: ileum1_lumen, target: gut_wall, type: absorption, ka_fraction: 0.8}
  - {source: ileum2_lumen, target: gut_wall, type: absorption, ka_fraction: 0.6}
  - {source: ileum3_lumen, target: gut_wall, type: absorption, ka_fraction: 0.3}
  - {source: colon_lumen, target: gut_wall, type: absorption, ka_fraction: 0.05}

  # ── Clearance ────────────────────────────
  - {source: liver, target: metabolized_hepatic, type: clearance, model: extended}
  - {source: gut_wall, target: metabolized_gut, type: clearance, model: well_stirred}
  - {source: kidney, target: excreted_renal, type: clearance, model: gfr_filtration}
