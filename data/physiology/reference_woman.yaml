# ICRP Publication 89 adult Reference Woman, 60 kg (PMID 14506981).
# Female masses: Table 2.8; blood: Section 7.4; output: Table 2.39; flows: Table 2.40.
# Organ mass g is represented as volume L at 1 kg/L, matching reference_man.yaml.
# Unchanged compositions, lumen transit, and exchange parameters come from reference_man.yaml.
# Blood pools partition the ICRP 3.9 L total in the reference-man model ratio.

global_params:
  cardiac_output: {mean: 354.0, cv: 0.10}   # L/h; ICRP 89 Table 2.39: 5.9 L/min × 60, CV inherited from reference_man
  body_weight: {mean: 60.0, cv: 0.0}        # kg; ICRP 89 Table 2.8 adult female
  hematocrit: {mean: 0.45, cv: 0.0}
  ivive_scaling: 0.00006                     # 60/1e6: converts uL/min -> L/h
  paracellular_pore_radius_angstrom: {mean: 5.6, cv: 0.08}   # Linnankoski 2010 (PMID 19827099) / Sugano 2002 / Kataoka 2011
  paracellular_permeability_scale:   {mean: 62.8, cv: 0.4}   # x10^-4 cm/s; atenolol jejunal Peff 0.45e-4 (Dahlgren 2016, PMID 27504798) back-out, cation E=1.4 folded in
  paracellular_charge_factor_cation: {mean: 1.4, cv: 0.25}   # cation-selective tight junction (Adson 1994; Tam-Velicky-Dryfe)
  paracellular_charge_factor_anion:  {mean: 0.7, cv: 0.25}   # anion hindrance

nodes:

  - name: venous_blood
    type: blood_pool
    volume: {mean: 2.75, cv: 0.12}  # L; ICRP 89 Section 7.4: 3.9 L total, model pool ratio; Hurley PMID 1110403 red-cell/plasma CV proxy

  - name: arterial_blood
    type: blood_pool
    volume: {mean: 1.11, cv: 0.12}  # L; ICRP 89 Section 7.4: 3.9 L total, model pool ratio; Hurley PMID 1110403 red-cell/plasma CV proxy

  - name: portal_vein
    type: blood_pool
    volume: 0.04  # L; ICRP 89 Section 7.4: 3.9 L total, model portal share

  - name: lung
    type: organ
    volume: 0.42  # L; ICRP 89 Table 2.8: lung tissue only 420 g
    composition: {fn: 0.0030, fp: 0.0128, fw: 0.811, pH: 7.0}

  - name: brain
    type: organ
    volume: 1.30  # L; ICRP 89 Table 2.8: 1300 g
    composition: {fn: 0.0391, fp: 0.0550, fw: 0.620, pH: 7.0}

  - name: heart
    type: organ
    volume: 0.25  # L; ICRP 89 Table 2.8: heart tissue only 250 g
    composition: {fn: 0.0117, fp: 0.0166, fw: 0.758, pH: 7.0}

  - name: liver
    type: organ
    volume: 1.40  # L; ICRP 89 Table 2.8: 1400 g
    composition: {fn: 0.0348, fp: 0.0252, fw: 0.751, pH: 7.0}
    enzymes:
      # Whole-liver pmol = same reference_man per-mg abundance × 45 MPPGL ×
      # ICRP 89 Table 2.8 female liver 1400 g / reference_man scaling basis 1500 g.
      CYP3A4: {mean: 8631000, cv: 0.763, correlation_group: liver_achour2021}
      CYP2D6: {mean:  630000, cv: 1.185, correlation_group: liver_achour2021}
      CYP1A2: {mean: 2835000, cv: 0.533, correlation_group: liver_achour2021}
      CYP2C9: {mean: 6048000, cv: 0.717, correlation_group: liver_achour2021}
      CYP2E1: {mean: 3087000, cv: 0.442, correlation_group: liver_achour2021}
      SPR:  {mean: 93333.33333, cv: 1.0}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      CES1: {mean: 74666666.67, cv: 0.47}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      CES2: {mean: 7840000, cv: 0.61}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      NAT2:    {mean: 9333333.333,   cv: 0.6}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      UGT1A1:  {mean: 1134000, cv: 0.5}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      UGT2B7:  {mean: 2268000, cv: 0.5}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      UGT1A9:  {mean: 756000, cv: 0.5}  # reference_man per-mg level × ICRP 89 female liver 1400/1500 g
      # Couto et al. 2019, Mol Pharm 16:632-647, PMID 30608694, Table 1.
      # Mean pmol/mg microsomal protein × 45 MPPGL × 1400 g liver; independent CVs.
      CYP2B6: {mean: 427140, cv: 0.8841}   # Couto 2019 PMID 30608694 Table 1: 6.78 pmol/mg × 45 × 1400; CV 88.41%
      CYP2C19: {mean: 216090, cv: 1.0449}  # Couto 2019 PMID 30608694 Table 1: 3.43 pmol/mg × 45 × 1400; CV 104.49%
      CYP3A5: {mean: 543690, cv: 1.1024}   # Couto 2019 PMID 30608694 Table 1: 8.63 pmol/mg × 45 × 1400; CV 110.24%
    transporters:
      OATP1B1: {mean: 121333.3333, cv: 0.484}  # reference_man × ICRP 89 female liver 1400/1500 g
    ivive_scaling: 0.00006   # 60/1e6: converts uL/min -> L/h (MPPGL * organ_wt already in abundance)
    fu_correction_applicable: 1.0   # B-11: fu_inc/fu_plasma correction applies to well_stirred/parallel_tube ClearanceFlux + ProdrugActivationFlux at this node. This node's clearance edge below uses model:extended (ECM), which models hepatic uptake explicitly and intentionally does NOT apply it (would double-count) — so here the flag is honored only by ProdrugActivation (e.g. clopidogrel). pipeline.predict warns on a curated non-1.0 value.

  - name: spleen
    type: organ
    volume: 0.13  # L; ICRP 89 Table 2.8: 130 g
    composition: {fn: 0.0077, fp: 0.0113, fw: 0.788, pH: 7.0}

  - name: gut_wall
    type: barrier_organ
    volume: 1.10  # L; ICRP 89 Table 2.8: stomach 140 + small intestine 600 + colon 145+145+70 g
    composition: {fn: 0.0163, fp: 0.0185, fw: 0.718, pH: 7.0}
    enzymes:
      # Total pmol scaled per unit tissue: ICRP 89 Table 2.8 female gut wall 1.10 kg / reference_man 1.03 kg.
      CYP3A4: {mean: 14778157.18, cv: 0.58}  # reference_man × ICRP 89 Table 2.8 gut 1.10/1.03 kg
      SPR:  {mean: 3203.883495, cv: 1.2}  # reference_man × ICRP 89 Table 2.8 gut 1.10/1.03 kg
      CES2: {mean: 3203883.495, cv: 0.6}  # reference_man × ICRP 89 Table 2.8 gut 1.10/1.03 kg
      ALPI: {mean: 24563.1068, cv: 0.9}  # reference_man × ICRP 89 Table 2.8 gut 1.10/1.03 kg
      UGT2B7: {mean: 3844.660194, cv: 0.6}  # reference_man × ICRP 89 Table 2.8 gut 1.10/1.03 kg
    ivive_scaling: 0.00006   # 60/1e6: converts uL/min -> L/h (MPPGL * organ_wt already in abundance)

  - name: kidney
    type: organ
    volume: 0.275  # L; ICRP 89 Table 2.8: kidneys 275 g
    composition: {fn: 0.0121, fp: 0.0242, fw: 0.783, pH: 7.0}
    enzymes:
      # Total pmol scaled per unit tissue: ICRP 89 Table 2.8 female kidney 0.275 kg / reference_man 0.31 kg.
      SPR: {mean: 26612.90323, cv: 1.0}  # reference_man × ICRP 89 Table 2.8 kidney 0.275/0.31 kg
    ivive_scaling: 0.00006

  - name: pancreas
    type: organ
    volume: 0.12  # L; ICRP 89 Table 2.8: 120 g
    composition: {fn: 0.0348, fp: 0.0252, fw: 0.751, pH: 7.0}

  - name: thymus
    type: organ
    volume: 0.02  # L; ICRP 89 Table 2.8: 20 g
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  - name: reproductive
    type: organ
    volume: 0.0931  # L; ICRP 89 Table 2.8: uterus 80 + ovaries 11 + tubes 2.1 g
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  - name: rest
    type: organ
    volume: 2.055  # L; reference_man 2.50 L × ICRP 89 female/male mass 60/73, rounded
    composition: {fn: 0.0132, fp: 0.0100, fw: 0.700, pH: 7.0}

  - name: adipose_vasc
    type: blood_pool
    volume: 0.95  # L; ICRP 89 Table 2.8: 19.0 kg separable adipose × model vascular 5%
    lookup_name: adipose

  - name: adipose_tissue
    type: organ
    volume: 18.05  # L; ICRP 89 Table 2.8: 19.0 kg separable adipose × model tissue 95%
    composition: {fn: 0.7021, fp: 0.0022, fw: 0.150, pH: 7.0}
    lookup_name: adipose

  - name: muscle_vasc
    type: blood_pool
    volume: 0.875  # L; ICRP 89 Table 2.8: 17.5 kg skeletal muscle × model vascular 5%
    lookup_name: muscle

  - name: muscle_tissue
    type: organ
    volume: 16.625  # L; ICRP 89 Table 2.8: 17.5 kg skeletal muscle × model tissue 95%
    composition: {fn: 0.0238, fp: 0.0072, fw: 0.760, pH: 7.0}
    lookup_name: muscle

  - name: bone_vasc
    type: blood_pool
    volume: 0.39  # L; ICRP 89 Table 2.8: 7.8 kg skeleton × model vascular 5%
    lookup_name: bone

  - name: bone_tissue
    type: organ
    volume: 7.41  # L; ICRP 89 Table 2.8: 7.8 kg skeleton × model tissue 95%
    composition: {fn: 0.0174, fp: 0.0010, fw: 0.439, pH: 7.0}
    lookup_name: bone

  - name: skin_vasc
    type: blood_pool
    volume: 0.115  # L; ICRP 89 Table 2.8: 2.3 kg skin × model vascular 5%
    lookup_name: skin

  - name: skin_tissue
    type: organ
    volume: 2.185  # L; ICRP 89 Table 2.8: 2.3 kg skin × model tissue 95%
    composition: {fn: 0.0284, fp: 0.0111, fw: 0.718, pH: 7.0}
    lookup_name: skin

  - name: stomach_lumen
    type: lumen
    volume: 0.25

  - name: duodenum_lumen
    type: lumen
    volume: 0.05

  - name: jejunum1_lumen
    type: lumen
    volume: 0.07

  - name: jejunum2_lumen
    type: lumen
    volume: 0.07

  - name: ileum1_lumen
    type: lumen
    volume: 0.06

  - name: ileum2_lumen
    type: lumen
    volume: 0.06

  - name: ileum3_lumen
    type: lumen
    volume: 0.06

  - name: colon_lumen
    type: lumen
    volume: 0.30

  - name: metabolized_hepatic
    type: sink
    volume: 1.0e+10

  - name: excreted_renal
    type: sink
    volume: 1.0e+10

  - name: metabolized_gut
    type: sink
    volume: 1.0e+10

  - name: excreted_fecal
    type: sink
    volume: 1.0e+10

edges:

  - {source: venous_blood, target: lung, type: flow, flow_fraction: 1.0}  # whole CO, model circulation
  - {source: lung, target: arterial_blood, type: flow, flow_fraction: 1.0}  # whole CO, model circulation

  - {source: arterial_blood, target: brain, type: flow, flow_fraction: 0.12}  # ICRP 89 Table 2.40 brain 12%
  - {source: brain, target: venous_blood, type: flow}

  - {source: arterial_blood, target: heart, type: flow, flow_fraction: 0.05}  # ICRP 89 Table 2.40 coronary tissue 5%
  - {source: heart, target: venous_blood, type: flow}

  - {source: arterial_blood, target: kidney, type: flow, flow_fraction: 0.17}  # ICRP 89 Table 2.40 kidneys 17%
  - {source: kidney, target: venous_blood, type: flow}

  - {source: arterial_blood, target: liver, type: flow, flow_fraction: 0.065}  # ICRP 89 Table 2.40 hepatic artery 6.5%
  - {source: liver, target: venous_blood, type: flow, flow_fraction: 0.27}  # ICRP 89 Table 2.40 liver total 27%

  - {source: arterial_blood, target: gut_wall, type: flow, flow_fraction: 0.165}  # ICRP 89 Table 2.40 GI 17%, reconciled by 0.5 point with rounded portal total 20.5%
  - {source: gut_wall, target: portal_vein, type: flow}

  - {source: arterial_blood, target: spleen, type: flow, flow_fraction: 0.03}  # ICRP 89 Table 2.40 spleen 3%
  - {source: spleen, target: portal_vein, type: flow}

  - {source: arterial_blood, target: pancreas, type: flow, flow_fraction: 0.01}  # ICRP 89 Table 2.40 pancreas 1%
  - {source: pancreas, target: portal_vein, type: flow}

  - {source: portal_vein, target: liver, type: flow, flow_fraction: 0.205}  # ICRP 89 Table 2.40 liver portal = 27% total - 6.5% arterial

  - {source: arterial_blood, target: thymus, type: flow, flow_fraction: 0.002}  # reference_man model partition
  - {source: thymus, target: venous_blood, type: flow}

  - {source: arterial_blood, target: reproductive, type: flow, flow_fraction: 0.004}  # ICRP 89 Table 2.44 uterus 0.4%
  - {source: reproductive, target: venous_blood, type: flow}

  - {source: arterial_blood, target: rest, type: flow, flow_fraction: 0.079}  # ICRP 89 Table 2.40 remainder to close systemic 100% after model partition
  - {source: rest, target: venous_blood, type: flow}

  - {source: arterial_blood, target: adipose_vasc, type: flow, flow_fraction: 0.085}  # ICRP 89 Table 2.40 fat 8.5%
  - {source: adipose_vasc, target: venous_blood, type: flow}
  - {source: adipose_vasc, target: adipose_tissue, type: diffusion, ps_product: 10.0}

  - {source: arterial_blood, target: muscle_vasc, type: flow, flow_fraction: 0.12}  # ICRP 89 Table 2.40 skeletal muscle 12%
  - {source: muscle_vasc, target: venous_blood, type: flow}
  - {source: muscle_vasc, target: muscle_tissue, type: diffusion, ps_product: 10.0}

  - {source: arterial_blood, target: bone_vasc, type: flow, flow_fraction: 0.05}  # ICRP 89 Table 2.40 skeleton 5%
  - {source: bone_vasc, target: venous_blood, type: flow}
  - {source: bone_vasc, target: bone_tissue, type: diffusion, ps_product: 10.0}

  - {source: arterial_blood, target: skin_vasc, type: flow, flow_fraction: 0.05}  # ICRP 89 Table 2.40 skin 5%
  - {source: skin_vasc, target: venous_blood, type: flow}
  - {source: skin_vasc, target: skin_tissue, type: diffusion, ps_product: 10.0}

  - {source: stomach_lumen, target: duodenum_lumen, type: transit, transit_rate: 4.0}
  - {source: duodenum_lumen, target: jejunum1_lumen, type: transit, transit_rate: 3.846}
  - {source: jejunum1_lumen, target: jejunum2_lumen, type: transit, transit_rate: 2.105}
  - {source: jejunum2_lumen, target: ileum1_lumen, type: transit, transit_rate: 2.105}
  - {source: ileum1_lumen, target: ileum2_lumen, type: transit, transit_rate: 1.471}
  - {source: ileum2_lumen, target: ileum3_lumen, type: transit, transit_rate: 1.471}
  - {source: ileum3_lumen, target: colon_lumen, type: transit, transit_rate: 1.471}
  - {source: colon_lumen, target: excreted_fecal, type: transit, transit_rate: 0.074}

  - {source: stomach_lumen, target: gut_wall, type: absorption, ka_fraction: 0.0}
  - {source: duodenum_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: jejunum1_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: jejunum2_lumen, target: gut_wall, type: absorption, ka_fraction: 1.0}
  - {source: ileum1_lumen, target: gut_wall, type: absorption, ka_fraction: 0.8}
  - {source: ileum2_lumen, target: gut_wall, type: absorption, ka_fraction: 0.6}
  - {source: ileum3_lumen, target: gut_wall, type: absorption, ka_fraction: 0.3}
  - {source: colon_lumen, target: gut_wall, type: absorption, ka_fraction: 0.05}

  - {source: duodenum_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 1.0}
  - {source: jejunum1_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 1.0}
  - {source: jejunum2_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 1.0}
  - {source: ileum1_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 0.8}
  - {source: ileum2_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 0.6}
  - {source: ileum3_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 0.3}
  - {source: colon_lumen, target: gut_wall, type: paracellular_absorption, ka_fraction: 0.05}

  - {source: liver, target: metabolized_hepatic, type: clearance, model: extended}
  - {source: gut_wall, target: metabolized_gut, type: clearance, model: well_stirred}
  - {source: kidney, target: excreted_renal, type: clearance, model: gfr_filtration}
