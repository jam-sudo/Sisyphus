[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisyphus"
dynamic = ["version"]
description = "Oral SMILES-only Cmax prediction with a topology-compiled PBPK track"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jae Min Yoon" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "rdkit",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pandas>=2.2,<3",
]
sbi = [
    "torch>=2.0",
    "sbi>=0.22",
    "nflows>=0.14",
]

[project.scripts]
sisyphus = "sisyphus.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
# Historical experiment/training utilities are not part of the supported product
# surface. CI passes the active release/audit scripts explicitly to Ruff.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with --run-slow)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sisyphus"]

[tool.hatch.version]
path = "src/sisyphus/_version.py"
