[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sisyphus"
version = "0.1.0"
description = "Graph-based PBPK simulation with native uncertainty propagation"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jae Min Yoon" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]
chem = [
    "rdkit",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
sisyphus = "sisyphus.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with --run-slow)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sisyphus"]
